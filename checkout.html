<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>NATIVA — Checkout</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="pages.css"></head><body><header class="top"><div class="wrap"><a class="brand" href="index.html">NATIVA</a><nav class="nav"><a href="carrinho.html">← Carrinho</a></nav></div></header><main class="page-main"><section class="page-hero"><span class="kicker">Checkout demonstrativo</span><h1>Compra sem ruído.</h1><p>Fluxo pronto para integração com endereço, frete, estoque e gateway de pagamento.</p></section><section class="checkout-grid"><form class="checkout-form" data-demo-checkout><label>Nome<input required></label><label>E-mail<input type="email" required></label><label class="full">Endereço<input required></label><label>Cidade<input required></label><label>CEP<input required></label><label>Entrega<select><option>Padrão · 4–6 dias</option><option>Expressa · 1–2 dias</option></select></label><label>Pagamento<select><option>Cartão</option><option>Pix</option></select></label><button class="checkout full">Finalizar demonstração</button><p class="full" data-checkout-result></p></form><aside class="summary"><h2>Pedido</h2><div class="summary-line"><span>Total</span><strong data-cart-total></strong></div><p>Produtos e pagamento são fictícios.</p></aside></section></main><script src="app.js"></script><script>document.querySelector('[data-demo-checkout]').onsubmit=e=>{e.preventDefault();document.querySelector('[data-checkout-result]').textContent='Pedido demonstrativo criado. Em produção, seguiria para autorização do pagamento e criação do pedido.'}</script></body></html>
