<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>NATIVA — Checkout</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="nativa-app.css?v=20260929-1820"></head><body><div data-shell-header></div><main class="page"><div class="wrap"><header class="page-head"><div><h1>Finalizar compra</h1><p>Endereço, entrega e pagamento.</p></div></header><form class="checkout-grid" data-checkout><div><section class="checkout-card"><h2>Contato</h2><label>Nome<input required></label><label>E-mail<input type="email" required></label></section><section class="checkout-card"><h2>Entrega</h2><label>Endereço<input required placeholder="Rua, número"></label><label>CEP<input required></label><label>Frete<select><option>Padrão · 3–7 dias</option><option>Express · 1–2 dias</option></select></label></section><section class="checkout-card"><h2>Pagamento</h2><label>Forma<select><option>Pix</option><option>Cartão</option></select></label></section></div><aside class="summary"><h2>Resumo</h2><div class="summary-line"><span>Total</span><strong data-cart-total></strong></div><button class="primary" style="width:100%;margin-top:12px">Finalizar pedido</button><small>Checkout demonstrativo. Nenhum pagamento é processado.</small></aside></form></div></main><div data-shell-footer></div><div data-cart-shell></div><script src="nativa-data.js?v=20261001-catalog"></script><script src="nativa-app.js?v=20261001-catalog"></script></body></html>
