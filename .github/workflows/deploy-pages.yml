name: Deploy NATIVA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate platform
        run: |
          test -f index.html
          test -f catalogo.html
          test -f produto.html
          test -f carrinho.html
          test -f checkout.html
          test -f favoritos.html
          test -f pedidos.html
          test -f conta.html
          test -f manifesto.html
          test -f nativa-data.js
          test -f nativa-app.js
          test -f nativa-app.css
          node --check nativa-data.js
          node --check nativa-app.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
