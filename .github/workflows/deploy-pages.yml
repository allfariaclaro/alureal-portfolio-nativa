name: Deploy NATIVA

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate platform
        run: |
          test -f index.html
          test -f catalogo.html
          test -f produto.html
          test -f carrinho.html
          test -f checkout.html
          test -f favoritos.html
          test -f pedidos.html
          test -f conta.html
          test -f manifesto.html
          test -f nativa-data.js
          test -f nativa-app.js
          test -f nativa-app.css
          node --check nativa-data.js
          node --check nativa-app.js

      - name: Browser smoke test
        run: |
          python3 -m http.server 4173 >/tmp/site.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID || true" EXIT
          sleep 1
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          timeout 25s "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=4000 --dump-dom http://127.0.0.1:4173/ > /tmp/dom.html
          grep -Fq "Carrinho" /tmp/dom.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
